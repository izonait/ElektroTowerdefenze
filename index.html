<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netzschutz 3D – Tower Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4EAEE; --panel:#F7F9FA; --line:#C3CED6;
  --ink:#1C2A35; --muted:#5B6B77; --accent:#2F6DB5; --danger:#D9480F; --gold:#C99A00;
  --g-ground:#CBD5DC; --g-tile:#E2E8EC; --g-trench:#9AA8B3; --g-lines:#B6C2CB;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101B24; --panel:#182733; --line:#2C3E4C;
    --ink:#E4ECF1; --muted:#93A4B1; --accent:#5B9BE6; --danger:#FF7A3D; --gold:#E9C23A;
    --g-ground:#1A2833; --g-tile:#22333F; --g-trench:#0F1820; --g-lines:#2C3F4D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101B24; --panel:#182733; --line:#2C3E4C;
  --ink:#E4ECF1; --muted:#93A4B1; --accent:#5B9BE6; --danger:#FF7A3D; --gold:#E9C23A;
  --g-ground:#1A2833; --g-tile:#22333F; --g-trench:#0F1820; --g-lines:#2C3F4D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:12px;padding:6px 10px;border-bottom:1.5px solid var(--line)}
.stats{display:flex;gap:16px;flex:1}
.stat .k{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);line-height:1}
.stat b{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b.flash{color:var(--danger)}
.stat small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.cu::before{content:"";width:8px;height:8px;border-radius:50%;background:#B8733A;display:inline-block;flex:none}
.ctl{display:flex;gap:6px}
.ctl{gap:5px}
.ctl button{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:7px 8px;font-weight:600;min-width:40px;height:38px}
.ib{display:grid;place-items:center;width:38px;padding:0!important;min-width:38px!important}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sound .x{display:none} #sound.off .x{display:inline} #sound.off .wv{display:none}
#pause .pl{display:none;fill:currentColor} #pause.paused .pl{display:inline} #pause.paused .pz{display:none}
#abils{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 100px)}
.ab{width:52px;height:52px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--accent) var(--p,100%),var(--line) 0);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.ab .in{width:44px;height:44px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.ab canvas{width:34px;height:34px}
.ab:disabled{cursor:default} .ab:disabled .in{opacity:.55}
.menu{display:grid;gap:8px;margin-top:6px}
.menu.row{grid-template-columns:auto 1fr}
.menu .primary small{display:block;font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;opacity:.8}
.second{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;padding:10px 16px}
.card.wide{max-width:560px}
.card h4{font-family:'Barlow Condensed',sans-serif;font-size:18px;margin:14px 0 6px}
.opts{display:grid;gap:8px}
.opts.maps{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.diffs{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px}
.opt canvas{width:100%;border-radius:4px;margin-bottom:4px}
.opts.heroes .opt{display:grid;grid-template-columns:44px 1fr;column-gap:10px;align-items:center}
.opts.heroes .opt canvas{width:44px;height:44px;grid-row:span 2;margin:0}
.opt b{font-family:'Barlow Condensed',sans-serif;font-size:17px;line-height:1.1}
.opt span{font-size:13px;color:var(--muted);line-height:1.3}
.chipopt{align-items:center;text-align:center;padding:8px 4px}
.chipopt b{font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.board{display:grid;gap:4px;margin:6px 0 14px;max-height:50vh;overflow:auto}
.brow{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper)}
.brow.me{border-color:var(--gold)}
.brow .bn{font-weight:600}
.brow b{font-family:'Barlow Condensed',sans-serif;font-size:17px}
.brow .bi{grid-column:1/-1;font-size:12px;color:var(--muted)}
.prof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;margin:4px 0 10px}
.prof .lvl{flex:none;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#1C2A35;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.prof .pt{flex:1;display:grid;gap:3px}
.prof b{font-family:'Barlow Condensed',sans-serif;font-size:18px}
.prof small{font-size:12px;color:var(--muted)}
.xpbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.xpbar.big{height:10px;margin-bottom:6px}
.menu .daily small,.menu .second small{display:block;font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;color:var(--muted)}
.menu.row2{grid-template-columns:1fr 1fr;margin:0}
.mds{display:flex;gap:4px;margin-top:4px}
.md{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.card h4 small{font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.perks{display:grid;gap:6px}
.perk{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.perk b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:16px}
.perk span{font-size:13px;color:var(--muted)}
.perk .pips span{width:12px}
.perk button:disabled{opacity:.45}
.stats2{display:grid;grid-template-columns:1fr auto 1fr auto;gap:4px 10px;font-size:14px;margin-bottom:14px}
.stats2 span{color:var(--muted)}
.achs{display:grid;gap:6px;max-height:44vh;overflow:auto}
.ach{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper);opacity:.6}
.ach.done{opacity:1;border-color:var(--gold)}
.ach i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.ach.done i{background:var(--gold);border-color:var(--gold)}
.ach b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:16px}
.ach span{font-size:13px;color:var(--muted)}
.ach em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.medtab{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;align-items:center}
.medtab .mds{margin:0}
.card .small{font-size:13px;color:var(--muted)}
.dprev{width:100%;border-radius:6px;margin-bottom:10px}
@media (max-width:380px){.stats{gap:10px}.stat b{font-size:20px}}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bossbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(340px,90%);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px 8px}
#bossbar .bn{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px}
#bossbar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
#bossbar .fill{height:100%;background:var(--danger);width:100%;transition:width .15s}
#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-6px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-weight:600;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#bossbar:not([hidden]) ~ #toast{top:70px}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;white-space:nowrap;pointer-events:none}
#bar{border-top:1.5px solid var(--line);padding:8px 0 10px}
.towers{display:flex;gap:6px;overflow-x:auto;padding:0 10px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.towers::-webkit-scrollbar{display:none}
.tw{flex:0 0 76px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px 5px;border:1.5px solid var(--line);background:var(--panel);border-radius:6px}
.tw canvas{width:34px;height:34px;display:block}
.tw.hero{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
#ultra{position:absolute;right:10px;bottom:10px;width:68px;height:68px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--gold) var(--p,100%),var(--line) 0);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#ultra .in{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
#ultra .in b{font-family:'Barlow Condensed',sans-serif;font-size:17px}
#ultra .in span{font-size:11px;opacity:.85}
#ultra:disabled{cursor:default}
#ultra:disabled .in{opacity:.7}
#ultra:not(:disabled) .in b{color:var(--gold)}
.hero-info{grid-template-columns:1fr auto}
.hero-info .xp{font-size:13px;color:var(--muted);text-align:right}
.xpbar{grid-column:1/-1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.hrow{grid-column:1/-1;display:flex;flex-direction:column;font-size:14px;margin-top:4px}
.hrow b{font-family:'Barlow Condensed',sans-serif;font-size:16px}
.hrow span{color:var(--muted)}
.hrow.small{font-size:13px;color:var(--muted)}
.hrow.small:empty{display:none}
.tw .n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;line-height:1.15;white-space:nowrap}
.tw .p{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.tw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tw:disabled{opacity:.42;cursor:default}
.goRow{display:flex;gap:8px;padding:0 10px}
.primary{flex:1;background:var(--ink);color:var(--paper);border:0;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;padding:11px 16px}
.primary:disabled{opacity:.45;cursor:default}
.toggle{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:0 12px;font-weight:600;font-size:14px}
.toggle[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
#panel{border-top:1.5px solid var(--line);padding:10px 10px 12px;display:grid;gap:8px;background:var(--panel)}
#panel .top{display:flex;align-items:center;gap:8px}
#panel h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;margin:0;flex:1;line-height:1}
#panel .meta{font-size:13px;color:var(--muted)}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-weight:600;font-size:14px}
.path{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.path .pn{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px}
.pips{display:flex;gap:4px;justify-content:flex-end}
.pips span{width:16px;height:6px;border-radius:3px;background:var(--line)}
.pips span.on{background:var(--accent)}
.pips span.on.hi{background:var(--gold)}
.path button{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;border-radius:6px;padding:8px 10px;background:var(--ink);color:var(--paper)}
.path button b{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600}
.path button span{font-size:13px;opacity:.85}
.path button em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.path button:disabled{background:var(--line);color:var(--muted);cursor:default}
.path button .tx{display:flex;flex-direction:column;min-width:0}
#panel .bottom{display:flex;gap:8px}
#panel .bottom button{flex:1}
#overlay{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px;overflow:auto;z-index:5}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:22px 20px;max-width:430px;width:100%}
.card h2{font-family:'Barlow Condensed',sans-serif;font-size:44px;line-height:1;margin:0 0 10px}
.card p{margin:0 0 10px;line-height:1.5}
.card ul{margin:0 0 14px;padding-left:18px;line-height:1.5;font-size:15px}
.card .best{color:var(--muted);font-size:14px;margin-bottom:14px}
.card .primary{width:100%}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%231C2A35%22/%3E%3Crect%20x%3D%22146%22%20y%3D%22120%22%20width%3D%22220%22%20height%3D%22272%22%20rx%3D%2222%22%20fill%3D%22%23E8C51C%22/%3E%3Cpath%20d%3D%22M276%20150%20L196%20268%20H252%20L232%20362%20L316%20238%20H262%20Z%22%20fill%3D%22%231C2A35%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#1C2A35">
<meta name="description" content="Netzschutz 3D: ein Tower-Defense-Spiel rund um Strom, Leitungen und Störimpulse.">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
<div id="app">
  <header>
    <div class="stats">
      <div class="stat"><span class="k">Netz</span><b id="lives">150</b></div>
      <div class="stat"><span class="k cu">Kupfer</span><b id="money">650</b></div>
      <div class="stat"><span class="k">Welle</span><b id="wave">0</b></div>
    </div>
    <div class="ctl">
      <button id="menuBtn" class="ib" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button id="sound" class="ib" aria-label="Ton ausschalten"><svg viewBox="0 0 24 24"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wv" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
      <button id="pause" class="ib" aria-label="Pause"><svg viewBox="0 0 24 24"><path class="pz" d="M8 5v14M16 5v14"/><path class="pl" d="M7 5l12 7-12 7z"/></svg></button>
      <button id="speed" aria-label="Geschwindigkeit">1×</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="c" aria-label="Spielfeld"></canvas>
    <div id="bossbar" hidden><div class="bn"><span id="bossName"></span><span id="bossPct"></span></div><div class="track"><div class="fill" id="bossFill"></div></div></div>
    <div id="toast" role="status"></div>
    <div id="hint" hidden>Nochmal tippen zum Bauen</div>
    <div id="abils"></div>
    <button id="ultra" hidden aria-label="Ultra auslösen"><span class="in"><b>Ultra</b><span id="ultraT">Bereit</span></span></button>
  </div>
  <footer id="bar">
    <div class="towers" id="towers"></div>
    <div class="goRow">
      <button id="auto" class="toggle" aria-pressed="false">Auto</button>
      <button id="go" class="primary">Welle 1 starten</button>
    </div>
  </footer>
  <div id="panel" hidden>
    <div class="top"><h3 id="pName"></h3><button class="chip" id="prio"></button><button class="chip" id="pClose" aria-label="Schließen">✕</button></div>
    <div class="meta" id="pMeta"></div>
    <div id="paths" style="display:grid;gap:8px"></div>
    <div class="bottom"><button class="chip" id="sell"></button></div>
  </div>
  <div id="overlay"></div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const cvs = $('#c'), stage = $('#stage');
const HAS3D = typeof THREE !== 'undefined';

/* ================= Daten ================= */
const ENEMY = {
  impuls:  {n:'Impuls',hp:1,sp:1.3,col:0xE03131,r:.16,rw:1,rank:1},
  puls2:   {n:'Doppelimpuls',hp:1,sp:1.7,col:0x1C7ED6,r:.17,rw:1,rank:2,ch:['impuls']},
  spitze:  {n:'Spitze',hp:1,sp:2.2,col:0x37B24D,r:.18,rw:1,rank:3,ch:['puls2']},
  welle:   {n:'Welle',hp:1,sp:3.0,col:0xF2C200,r:.18,rw:1,rank:4,ch:['spitze']},
  flimmer: {n:'Flimmer',hp:1,sp:3.4,col:0xE64980,r:.19,rw:1,rank:5,ch:['welle']},
  spannung:{n:'Überspannung',hp:1,sp:1.8,col:0x2A2D31,r:.16,rw:1,rank:6,ch:['flimmer','flimmer']},
  iso:     {n:'Isoliert',hp:1,sp:1.0,col:0xA3ACB4,r:.2,rw:1,rank:7,ch:['spannung','spannung'],iso:true},
  keramik: {n:'Keramik',hp:10,sp:2.0,col:0xB5651D,r:.23,rw:2,rank:8,ch:['spannung','spannung'],scale:true},
  block:   {n:'Lastblock',hp:200,sp:0.8,col:0x2B6CB0,r:.4,rw:25,rank:20,ch:['keramik','keramik','keramik','keramik'],big:true,scale:true},
  grosslast:{n:'Großlast',hp:700,sp:0.5,col:0xC92A2A,r:.5,rw:60,rank:30,ch:['block','block','block','block'],big:true,scale:true},
  stoer:   {n:'Störsender',hp:60,sp:1.0,col:0x7048E8,r:.3,rw:8,rank:12,ch:['keramik','keramik'],scale:true,jam:true},
  mega:    {n:'Netzkollaps',hp:4000,sp:0.4,col:0x343A40,r:.6,rw:150,rank:40,ch:['grosslast','grosslast','grosslast','grosslast'],big:true,scale:true},
  boss:    {n:'Kurzschluss',hp:4000,sp:0.28,col:0x2A2D31,r:.6,rw:0,rank:100,big:true,boss:true}
};
const leakMemo = {};
function leakCost(k){
  if(leakMemo[k]) return leakMemo[k];
  const d=ENEMY[k]; let c=d.hp; (d.ch||[]).forEach(x=>c+=leakCost(x));
  return leakMemo[k]=c;
}
const U = (n,c,d,m) => ({n,c,d,m});

function applyMod(s,m){
  for(const k in m){
    const v=m[k];
    if(typeof v==='boolean') s[k]=v;
    else if(k.endsWith('Mul')){ const b=k.slice(0,-3); s[b]=(s[b]===undefined?1:s[b])*v; }
    else s[k]=(s[k]||0)+v;
  }
}

function ownStats(t){
  const d=TOWERS[t.type];
  if(d.hero) return heroStats(t.hlv);
  const s=Object.assign({vsBig:1},d.base);
  for(let p=0;p<2;p++) for(let i=0;i<t.lv[p];i++) applyMod(s,d.paths[p].u[i].m);
  return s;
}
function canUpgrade(t,p){
  const n=t.lv[p]+1; if(n>4) return false;
  const other=t.lv[1-p];
  return Math.min(n,other)<=2;
}

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function buildWave(w){
  const R=rng(w*9973+7), q=[]; let t=0;
  const add=(k,n,gap,camo=false,mods)=>{ for(let i=0;i<n;i++){ q.push({k,camo,t,mods}); t+=gap; } t+=.8; };
  const tiers=['impuls','puls2','spitze','welle','flimmer','spannung','keramik'];
  const top=Math.min(6,Math.floor(w/5));
  const boss=w%40===0;
  const n=Math.round((14+w*.9)*(boss?.5:1));
  const groups=3+Math.floor(w/12);
  const gap=Math.max(.12,.6-w*.008);
  for(let g=0;g<groups;g++){
    const ti=Math.max(0,top-Math.floor(R()*Math.min(3,top+1)));
    const cnt=Math.max(4,Math.round(n/groups*(ti===top?1.2:1)));
    const camo=w>=26 && ti<=5 && R()<.35;

let COLS,ROWS,PATHS=[],pathSet,blockSet=new Set(),blockList=[],portrait;
let W=0,H=0;
function setupMap(){

  COLS=portrait?9:14; ROWS=portrait?14:9;
  pathSet=new Set();
  PATHS=MAPS[curMap].paths.map(raw=>{
    const wp=raw.map(([x,y])=>portrait?[y,x]:[x,y]), seg=[]; let total=0;
    for(let i=0;i<wp.length-1;i++){
      const [x0,y0]=wp[i],[x1,y1]=wp[i+1], dx=Math.sign(x1-x0), dy=Math.sign(y1-y0);
      let x=x0,y=y0;
      for(;;){ if(x>=0&&y>=0&&x<COLS&&y<ROWS) pathSet.add(x+','+y); if(x===x1&&y===y1) break; x+=dx; y+=dy; }
      const l=Math.abs(x1-x0)+Math.abs(y1-y0); seg.push(l); total+=l;
    }
    return {wp,seg,total};
  });
  // Hindernisse (in Querformat-Koordinaten bestimmt, damit sie beim Drehen gleich bleiben)
  blockSet=new Set(); blockList=[];
  const R=rng([...curMap].reduce((a,c)=>a*31+c.charCodeAt(0),7)), raw=new Set();
  MAPS[curMap].paths.forEach(p=>{ for(let i=0;i<p.length-1;i++){ const [x0,y0]=p[i],[x1,y1]=p[i+1],dx=Math.sign(x1-x0),dy=Math.sign(y1-y0); let x=x0,y=y0; for(;;){ raw.add(x+','+y); if(x===x1&&y===y1)break; x+=dx;y+=dy; } } });
  const free=[]; for(let x=0;x<14;x++) for(let y=0;y<9;y++) if(!raw.has(x+','+y)) free.push([x,y]);
  for(let n=0;n<(MAPS[curMap].obst||0)&&free.length;n++){
    const [x,y]=free.splice(Math.floor(R()*free.length),1)[0];
    const c=portrait?[y,x]:[x,y]; blockSet.add(c[0]+','+c[1]); blockList.push({x:c[0],y:c[1],r:R()});
  }
}
function posAt(pi,d){
  const P=PATHS[pi]||PATHS[0]; let i=0;

}

function recalc(){
  const trafos=G.towers.filter(t=>t.type==='trafo');
  trafos.forEach(t=>t.s=ownStats(t));
  if(G.hero && curHero==='meisterin'){ const hs=ownStats(G.hero); trafos.push({x:G.hero.x,y:G.hero.y,s:{range:hs.aura,bRange:hs.bRange,bCd:hs.bCd,bDmg:hs.bDmg,bCamo:false,bIso:false}}); }
  for(const t of G.towers){
    if(t.type==='trafo') continue;
    const s=ownStats(t);
    if(t.type==='held'){ t.s=s; continue; }
    let rM=1,cM=1,dA=0,camo=false,iso=false;
    for(const tr of trafos){
      const dx=tr.x-t.x, dy=tr.y-t.y;
      if(dx*dx+dy*dy<=tr.s.range*tr.s.range){
        rM=Math.max(rM,tr.s.bRange); cM=Math.min(cM,tr.s.bCd); dA=Math.max(dA,tr.s.bDmg);
        camo=camo||tr.s.bCamo; iso=iso||tr.s.bIso;

    if(s.cd) s.cd*=cM;
    if(s.dmg) s.dmg+=dA;
    if(s.dps) s.dps*=(1+.5*dA)/cM;
    if(camo) s.camo=true;
    if(iso) s.iso=true;

}

  }

  g.enemies=g.enemies.filter(e=>{ if(e.dead) removeEnemyMesh(e); return !e.dead; });

    if(typeof onWaveDone==='function') onWaveDone();
    if(typeof saveGame==='function') saveGame();
    g.autoT=1.2;
  }
}

function buildBoard(){
  if(!HAS3D||!COLS) return;

  decoAnim=[];
  const T=theme();
  board=new THREE.Group();
  const top=new THREE.MeshStandardMaterial({map:boardTexture(),roughness:.9});
  const side=std(T.side,{roughness:.8});
  const slab=new THREE.Mesh(new THREE.BoxGeometry(COLS,.5,ROWS),[side,side,top,side,side,side]);
  slab.position.y=-.25; slab.receiveShadow=true; board.add(slab);
  // Umgebung
  const outerMat=T.water?new THREE.MeshStandardMaterial({color:T.outer,roughness:.2,metalness:.3,emissive:0x0B3D66,emissiveIntensity:.25}):std(T.outer,{roughness:.95});
  const outer=new THREE.Mesh(new THREE.PlaneGeometry(COLS+30,ROWS+30),outerMat); outer.rotation.x=-Math.PI/2; outer.position.y=-.52; outer.receiveShadow=true; board.add(outer);
  if(T.water){ const rim=mesh(GEO.box,std(0xE3C58F,{roughness:.9}),0,-.5,0,false); rim.scale.set(COLS+2.4,.08,ROWS+2.4); rim.receiveShadow=true; board.add(rim); decoAnim.push(tt=>outerMat.emissiveIntensity=.22+Math.sin(tt*1.5)*.06); }
  const R=rng(1234+[...curMap].reduce((a,c)=>a+c.charCodeAt(0),0));
  const rad=T.water?2.2:9;
  for(let k=0;k<(T.water?18:46);k++){
    const x=(R()*2-1)*(COLS/2+rad), z=(R()*2-1)*(ROWS/2+rad);
    if(Math.abs(x)<COLS/2+.6 && Math.abs(z)<ROWS/2+.6) continue;
    const d=makeDecor(T.outerDecor[Math.floor(R()*T.outerDecor.length)],R());
    d.position.set(x,-.5,z); d.scale.multiplyScalar(1+R()*.5); board.add(d);
  }
  // Hindernisse auf dem Brett
  for(const b of blockList){
    const type=T.block[Math.floor(b.r*T.block.length)];
    if(type==='water') continue;
    const d=makeDecor(type,b.r); d.position.set(wx(b.x+.5),0,wz(b.y+.5)); board.add(d);
  }
  const cabMat=std(0x3A4148,{roughness:.4,metalness:.2});
  for(const P of PATHS){
    const WP=P.wp, cp=cablePath(WP);
    const cable=new THREE.Mesh(new THREE.TubeGeometry(cp,Math.round(P.total*14),.12,10,false),cabMat);
    cable.receiveShadow=true; board.add(cable);
    const dx=Math.sign(WP[1][0]-WP[0][0]), dy=Math.sign(WP[1][1]-WP[0][1]);
    const inBox=mesh(GEO.box,MAT.dark,wx(WP[0][0]+.5+dx*.5),.25,wz(WP[0][1]+.5+dy*.5));
    inBox.scale.set(dx?.3:.7,.5,dy?.3:.7); board.add(inBox);
  }
  if(T.pattern==='server'||T.pattern==='lava'){ const glowC=T.pattern==='server'?0x22D3EE:0xFF6B1A; const gm=new THREE.MeshBasicMaterial({color:glowC,transparent:true,opacity:.35}); for(const P of PATHS){ const tube=new THREE.Mesh(new THREE.TubeGeometry(cablePath(P.wp),Math.round(P.total*10),.15,8,false),gm); board.add(tube); } decoAnim.push(tt=>gm.opacity=.22+Math.sin(tt*2)*.12); }
  const WP=PATHS[0].wp;
  // Verteiler
  const [bx,by]=WP[WP.length-1];
  base3d=new THREE.Group(); base3d.position.set(wx(bx+.5),0,wz(by+.5));
  const cab=mesh(GEO.box,std(0xE8C51C,{roughness:.45}),0,.45,0); cab.scale.set(.82,.9,.62); base3d.add(cab);
  const door=mesh(GEO.box,std(0xD4B000,{roughness:.5}),0,.45,.315,false); door.scale.set(.7,.78,.02); base3d.add(door);
  const shape=new THREE.Shape(); const pts=[[.15,-.75],[-.35,.08],[0,.08],[-.15,.75],[.35,-.08],[0,-.08]];
  pts.forEach(([a,b],i)=> i?shape.lineTo(a*.28,-b*.28):shape.moveTo(a*.28,-b*.28));
  const bolt=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshBasicMaterial({color:0x1C2A35})); bolt.position.set(0,.47,.327); base3d.add(bolt);
  const lamp=mesh(GEO.sphere,new THREE.MeshStandardMaterial({color:0x51CF66,emissive:0x51CF66,emissiveIntensity:.9}),0,.95,0,false); lamp.scale.setScalar(.07); base3d.add(lamp);

  board.add(base3d);

function addEnemyMesh(e){
  if(!HAS3D) return;
  const d=ENEMY[e.k]; let m;
  const mat=e.camo?MAT.camo[e.k]:MAT.enemy[e.k];
  if(e.k==='block'||e.k==='grosslast'){
    m=new THREE.Group(); const s=e.k==='block'?1:1.25;
    const b=mesh(GEO.box,mat); b.scale.set(.5*s,.4*s,.8*s); m.add(b);
    for(const z of [-.25,.25]){ const st=mesh(GEO.box,MAT.dark,0,0,z*s,false); st.scale.set(.52*s,.42*s,.08*s); m.add(st); }
    const cap=mesh(GEO.box,MAT.steel,0,.22*s,0,false); cap.scale.set(.2*s,.05*s,.3*s); m.add(cap);
    m.userData.y=.42*s;
  } else if(e.k==='mega'){
    m=new THREE.Group();
    const b=mesh(GEO.box,mat); b.scale.set(.8,.6,1.25); m.add(b);
    for(const z of [-.4,0,.4]){ const st=mesh(GEO.box,dmat(0xF2C200,{metalness:.5}),0,0,z,false); st.scale.set(.82,.62,.08); m.add(st); }
    const cap=mesh(GEO.box,MAT.steel,0,.33,0,false); cap.scale.set(.3,.06,.5); m.add(cap);
    m.userData.y=.6;
  } else if(e.k==='stoer'){
    m=new THREE.Group();
    const core=mesh(GEO.ico,mat); core.scale.setScalar(.26); m.add(core);
    const ant=mesh(new THREE.CylinderGeometry(.015,.015,.35,6),MAT.steel,0,.3,0,false); m.add(ant);
    const tip=mesh(GEO.sphere,new THREE.MeshStandardMaterial({color:0xB197FC,emissive:0xB197FC,emissiveIntensity:1}),0,.48,0,false); tip.scale.setScalar(.05); m.add(tip);
    m.userData.y=.45;
  } else if(e.boss){
    m=new THREE.Group();
    const core=mesh(GEO.ico,mat); core.scale.setScalar(.5); m.add(core);
    const orbit=new THREE.Group(); m.add(orbit);
    const tr=mesh(new THREE.TorusGeometry(.75,.05,8,40),new THREE.MeshStandardMaterial({color:0xFF3B3B,emissive:0xFF3B3B,emissiveIntensity:.8})); tr.rotation.x=Math.PI/2; orbit.add(tr);
    m.userData.core=core; m.userData.orbit=orbit; m.userData.y=.75;
    const sh=mesh(GEO.sphere,new THREE.MeshBasicMaterial({color:0x74C0FC,transparent:true,opacity:.25,depthWrite:false}),0,0,0,false); sh.scale.setScalar(.85); sh.visible=false; m.add(sh); m.userData.shield=sh;
  } else {
    m=mesh(e.k==='keramik'?GEO.dodeca:GEO.sphere,mat,0,0,0,e.k==='keramik');
    m.scale.setScalar(e.r); m.userData.y=.32+e.r*.4;
  }
  if(e.big){
    const bar=new THREE.Group(); bar.renderOrder=10;
    const bg=mesh(GEO.box,MAT.hpBg,0,0,0,false); bg.scale.set(.8,.07,.001); bg.renderOrder=10;
    const fg=mesh(GEO.box,MAT.hpFg,0,0,.002,false); fg.scale.set(.8,.07,.001); fg.renderOrder=11;
    bar.add(bg,fg); bar.userData.fg=fg; scene.add(bar); e.bar=bar;
  }
  if(e.fort||e.regen){
    const host=m.isGroup?m:null;
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.08,6,20),e.regen?MAT.regen:MAT.fort); ring.rotation.x=Math.PI/2;
    if(host){ ring.scale.setScalar(e.r*1.4); host.add(ring); } else { ring.scale.setScalar(1.3); m.add(ring); }
  }
  e.m=m; e.ph=Math.random()*6; scene.add(m);
}
function removeEnemyMesh(e){ if(!HAS3D) return; if(e.m) scene.remove(e.m); if(e.bar) scene.remove(e.bar); }
function makeProj(p){
  if(HAS3D){ p.m=mesh(GEO.proj,new THREE.MeshBasicMaterial({color:p.col}),0,.4,0,false); if(p.kind==='bomb') p.m.scale.setScalar(1.8); scene.add(p.m); }
  return p;
}
function removeProj(p){ if(HAS3D && p.m){ scene.remove(p.m); p.m.material.dispose(); } }
function addFx(f){ G.fx.push(f); if(G.fx.length>90){ const o=G.fx.shift(); if(o.m){ scene.remove(o.m); o.dispose&&o.dispose(); } } }
function segBoxes(points,th,mat){
  const g=new THREE.Group();
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1], len=a.distanceTo(b); if(len<1e-4) continue;
    const m=new THREE.Mesh(GEO.box,mat); m.scale.set(th,th,len);
    m.position.copy(a).add(b).multiplyScalar(.5); m.lookAt(b); g.add(m);
  }
  return g;
}
function fxBolt(pts,col,dur,straight){
  if(!HAS3D) return;
  const P=[]; const y=.55;
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i],[x1,y1]=pts[i+1], steps=straight?1:4;
    for(let s=0;s<steps;s++){ const t=s/steps, j=(s&&!straight)?(Math.random()-.5)*.3:0;
      P.push(new THREE.Vector3(wx(x0+(x1-x0)*t)+j,(i===0&&s===0)?.85:y+j*.5,wz(y0+(y1-y0)*t)+j)); }
  }
  const [lx,ly]=pts[pts.length-1]; P.push(new THREE.Vector3(wx(lx),y,wz(ly)));
  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1});
  const m=segBoxes(P,straight?.05:.045,mat); scene.add(m);
  addFx({m,t:dur,T:dur,upd:a=>mat.opacity=a,dispose:()=>mat.dispose()});
}
function fxBoom(x,y,r,col){
  if(!HAS3D) return;
  const mat=new THREE.MeshBasicMaterial({color:col||0x8CE99A,transparent:true,opacity:.6,depthWrite:false});
  const m=mesh(GEO.sphere,mat,wx(x),.3,wz(y),false); scene.add(m);
  addFx({m,t:.35,T:.35,upd:a=>{ m.scale.setScalar(r*(1.15-a*.6)); mat.opacity=a*.55; },dispose:()=>mat.dispose()});
}
function fxRing(x,y,r,col){
  if(!HAS3D) return;
  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.8,depthWrite:false,side:THREE.DoubleSide});
  const m=mesh(GEO.rangeRing,mat,wx(x),.08,wz(y),false); m.rotation.x=-Math.PI/2; scene.add(m);
  addFx({m,t:.5,T:.5,upd:a=>{ m.scale.setScalar(r*(1.1-a*.8)); mat.opacity=a; },dispose:()=>mat.dispose()});
}
function fxStrike(x,y){
  if(!HAS3D) return;
  const P=[]; let px=wx(x), pz=wz(y);
  for(let i=0;i<=6;i++){ const yy=6-i; const j=i<6?(Math.random()-.5)*.5:0; P.push(new THREE.Vector3(px+j,Math.max(.4,yy),pz+j)); }
  const mat=new THREE.MeshBasicMaterial({color:0xFFF3BF,transparent:true,opacity:1});
  const m=segBoxes(P,.07,mat); scene.add(m);
  addFx({m,t:.45,T:.45,upd:a=>mat.opacity=a,dispose:()=>mat.dispose()});
}
let popCount=0;
function fxPop(e){
  if(!HAS3D || e.big===false && popCount>25) return;
  popCount++;
  const mat=new THREE.MeshBasicMaterial({color:ENEMY[e.k].col,transparent:true,opacity:.7,depthWrite:false});
  const m=mesh(GEO.sphere,mat,wx(e.x),e.m?e.m.position.y:.4,wz(e.y),false); scene.add(m);
  const r=e.big?e.r*1.6:e.r*1.4;
  addFx({m,t:.22,T:.22,upd:a=>{ m.scale.setScalar(r*(1.4-a*.6)); mat.opacity=a*.7; },dispose:()=>{ mat.dispose(); popCount--; }});
}
function clearScene(){
  if(!HAS3D||!G) return;
  G.towers.forEach(t=>t.m&&scene.remove(t.m.g));
  G.enemies.forEach(removeEnemyMesh);
  G.proj.forEach(removeProj);
  (G.traps||[]).forEach(removeTrap);
  G.towers.forEach(t=>t.m&&t.m.dr&&t.m.dr.forEach(d=>scene.remove(d)));
  G.fx.forEach(f=>{ scene.remove(f.m); f.dispose&&f.dispose(); });
}

/* Kamera so einpassen, dass das Brett den Bildschirm füllt */
const camTarget = HAS3D ? new THREE.Vector3() : null;
function fitCamera(){
  if(!HAS3D||!W||!H) return;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  const pitch=portrait?58*Math.PI/180:52*Math.PI/180;
  const dir=new THREE.Vector3(0,Math.sin(pitch),Math.cos(pitch));
  const hw=COLS/2+.1, hd=ROWS/2+.1;
  const pts=[]; for(const y of [0,.9]) for(const x of [-hw,hw]) for(const z of [-hd,hd]) pts.push(new THREE.Vector3(x,y,z));
  camTarget.set(0,0,0);
  const v=new THREE.Vector3();
  const measure=d=>{
    camera.position.copy(camTarget).addScaledVector(dir,d); camera.lookAt(camTarget); camera.updateMatrixWorld(true);
    let mx=0,minY=9,maxY=-9;
    for(const p of pts){ v.copy(p).project(camera); if(!(v.z>-1&&v.z<1)) mx=9; mx=Math.max(mx,Math.abs(v.x)); minY=Math.min(minY,v.y); maxY=Math.max(maxY,v.y); }
    return {mx,minY,maxY};
  };
  let d=20;
  for(let it=0;it<6;it++){
    let lo=3,hi=90;
    for(let k=0;k<26;k++){ const mid=(lo+hi)/2, m=measure(mid); if(m.mx<=.97 && m.minY>=-.97 && m.maxY<=.97) hi=mid; else lo=mid; }
    d=hi; const m=measure(d); const cy=(m.minY+m.maxY)/2;
    camTarget.z -= cy*hd*.9;
  }
  measure(d);
  sun.position.set(-5,14,7); sun.target.position.set(0,0,0);
}
function pickCell(ev){
  const r=cvs.getBoundingClientRect();
  if(!HAS3D) return null;
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(ndc,camera);
  const p=new THREE.Vector3(); if(!rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p)) return null;
  const x=Math.floor(p.x+COLS/2), y=Math.floor(p.z+ROWS/2);
  return (x>=0&&y>=0&&x<COLS&&y<ROWS)?{x,y}:null;
}

function render(time,dt){
  if(!HAS3D) return;
  const tt=time/1000;
  for(const e of G.enemies){
    if(!e.m) continue;
    const y=e.m.userData.y + (e.big?0:Math.sin(tt*6+e.ph)*.04);
    e.m.position.set(wx(e.x),y,wz(e.y));
    if(e.big) e.m.rotation.y=e.dir;
    if(e.boss){ e.m.userData.core.rotation.x=tt*.8; e.m.userData.core.rotation.y=tt*1.1; e.m.userData.orbit.rotation.z=Math.sin(tt)*.4; e.m.userData.orbit.rotation.y=tt*2; e.m.userData.shield.visible=e.shield>0; }
    else if(!e.big) e.m.rotation.y=tt*2+e.ph;
    if(e.bar){ e.bar.position.set(wx(e.x),y+(e.boss?.95:.55),wz(e.y)); e.bar.quaternion.copy(camera.quaternion); const f=Math.max(0,e.hp/e.max); e.bar.userData.fg.scale.x=.8*f; e.bar.userData.fg.position.x=-.4*(1-f); }
  }
  for(const t of G.towers){
    const m=t.m; if(!m) continue;
    if(t.aim!==undefined) m.head.rotation.y += (((t.aim-m.head.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*.35;
    if(m.spin){ if(t.type==='windrad') m.spin.rotation.z-=.03*G.speed; else m.spin.rotation.y+=(t.on?.12:.02)*G.speed; }
    if(m.glow){
      t.flash=Math.max(0,(t.flash||0)-.016);
      const base = t.type==='plasma' ? (t.on? 1.4+Math.sin(tt*30)*.4 : .4) : .5;
      m.glow.material.emissiveIntensity = base + t.flash*14;
    }
    if(m.aura) m.aura.material.opacity = t.on ? .12+Math.sin(tt*8)*.04 : .06;
  }
  for(const f of decoAnim) f(tt);
  for(const t of G.towers){
    if(t.type!=='drohne'||!t.m) continue;
    const n=t.drones?t.drones.length:0; t.m.dr=t.m.dr||[];
    while(t.m.dr.length<n){ const d=makeDroneMesh(); scene.add(d); t.m.dr.push(d); }
    while(t.m.dr.length>n){ scene.remove(t.m.dr.pop()); }
    t.m.dr.forEach((d,i)=>{ const [x,y]=t.drones[i]; d.position.set(wx(x),1.25+Math.sin(tt*3+i)*.05,wz(y)); d.rotation.y=-(t.dang||0); d.userData.rot.forEach(r=>r.rotation.y+=.8); });
  }
  for(const t of G.towers){ if(t.m&&t.m.g) t.m.g.visible=true; if(t.jam>0&&t.m&&t.m.glow) t.m.glow.material.emissiveIntensity=0; }
  for(const p of G.proj){ if(!p.m) continue; let y=.42; if(p.kind==='bomb'){ const dd=Math.hypot(p.tx-p.x,p.ty-p.y)+p.prog; y=.4+Math.sin(Math.PI*Math.min(1,p.prog/Math.max(.01,dd)))*.9; } p.m.position.set(wx(p.x),p.air?1.1:y,wz(p.y)); }
  G.fx=G.fx.filter(f=>{ f.t-=dt; f.upd(Math.max(0,f.t/f.T)); if(f.t<=0){ scene.remove(f.m); f.dispose&&f.dispose(); return false; } return true; });
  // Geist und Reichweite
  const show=(x,y,r,col)=>{ rangeRing.visible=r<50; rangeRing.position.set(wx(x+.5),.03,wz(y+.5)); rangeRing.scale.setScalar(r); rangeRing.children.forEach(c=>c.material.color.setHex(col)); };
  rangeRing.visible=false; ghost.visible=false;
  if(G.sel) show(G.sel.x,G.sel.y,G.sel.s.range,0xffffff);
  else if(G.build && G.ghost){
    const ok=canBuild(G.ghost.x,G.ghost.y);
    ghost.visible=true; ghost.position.set(wx(G.ghost.x+.5),0,wz(G.ghost.y+.5)); ghost.userData.mat.color.setHex(ok?0xffffff:0xFF6B6B);
    const r=TOWERS[G.build].base.range; if(r>0) show(G.ghost.x,G.ghost.y,r, ok?0xffffff:0xFF6B6B);
  }
  if(base3d){ const l=base3d.userData.lamp; const hurtT=Math.max(0,(G.hurtT||0)); l.material.color.setHex(hurtT>0?0xFF4D4D:0x51CF66); l.material.emissive.setHex(hurtT>0?0xFF4D4D:0x51CF66); }
  G.flashT=Math.max(0,(G.flashT||0)-(dt||0)); hemi.intensity=.75+G.flashT*2.2;
  renderer.render(scene,camera);
}

function resize(){
  const r=stage.getBoundingClientRect();
  W=r.width; H=r.height; if(!W||!H) return;
  const was=portrait;
  setupMap();
  if(was!==undefined && was!==portrait && G){
    G.towers.forEach(t=>{ const x=t.x; t.x=t.y; t.y=x; if(t.m) t.m.g.position.set(wx(t.x+.5),0,wz(t.y+.5)); });
    G.proj.forEach(removeProj); G.proj=[]; G.traps.forEach(removeTrap); G.traps=[];
    G.enemies.forEach(e=>{ [e.x,e.y]=posAt(e.pi,e.dist); });
    G.ghost=null; recalc();
  }
  if(HAS3D){
    renderer.setSize(W,H,false);
    if(was!==portrait || !board) buildBoard();
    fitCamera();
  }
}

let AC=null, master=null, muted=false; const lastSfx={};
try{ muted=localStorage.getItem('netzschutz3d-mute')==='1'; }catch(e){}
function audioInit(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
  AC=new A(); master=AC.createGain(); master.gain.value=muted?0:.22; master.connect(AC.destination);
}
function setMuted(m){ muted=m; if(master) master.gain.value=m?0:.22; try{ localStorage.setItem('netzschutz3d-mute',m?'1':'0'); }catch(e){} }
function tone(type,f0,f1,dur,vol,delay){
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
}
let noiseBuf=null;
function noise(dur,vol,freq,q,type){
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t=AC.currentTime, src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  src.buffer=noiseBuf; f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+dur+.02);
}
const SFX_GAP={freeze:.2,pew:.07,pop:.035,zap:.06,laser:.08,boom:.08,thump:.1,leak:.15};
function sfx(n){
  if(!AC||muted||AC.state!=='running') return;
  const now=AC.currentTime; if(SFX_GAP[n] && now-(lastSfx[n]||0)<SFX_GAP[n]) return; lastSfx[n]=now;
  switch(n){
    case 'pew': tone('triangle',900,380,.07,.18); break;
    case 'pop': tone('sine',700+Math.random()*300,250,.04,.12); break;
    case 'zap': noise(.12,.35,2500,2); tone('square',700,180,.1,.08); break;
    case 'laser': tone('sawtooth',1500,250,.12,.12); break;
    case 'thump': tone('sine',160,60,.12,.3); break;
    case 'boom': noise(.35,.6,500,.7,'lowpass'); tone('sine',90,40,.3,.35); break;
    case 'leak': tone('square',140,110,.25,.15); break;
    case 'wave': tone('sine',523,0,.12,.2); tone('sine',784,0,.18,.2,.1); break;
    case 'done': tone('sine',659,0,.12,.18); tone('sine',880,0,.12,.18,.1); tone('sine',1047,0,.22,.18,.2); break;
    case 'build': tone('triangle',300,600,.09,.25); break;
    case 'upgrade': [523,659,784,1047].forEach((f,i)=>tone('triangle',f,0,.1,.18,i*.06)); break;
    case 'level': [392,523,659,784].forEach((f,i)=>tone('square',f,0,.12,.1,i*.08)); break;
    case 'coin': tone('square',988,0,.08,.12); tone('square',1319,0,.2,.12,.08); break;
    case 'ultra': noise(1,.7,1200,.5); tone('sawtooth',220,40,1,.25); break;
    case 'boss': tone('sawtooth',70,40,1.4,.35); tone('sawtooth',73,42,1.4,.3); break;
    case 'click': tone('sine',600,0,.04,.12); break;
    case 'freeze': noise(.4,.25,6000,1,'highpass'); tone('sine',1800,900,.3,.06); break;
  }
}

  c.fillStyle=T.tile; c.fillRect(0,0,w,h);
  if(T.water){ c.fillStyle='#2B79B5'; }
  c.strokeStyle=T.trench; c.lineWidth=s*.8; c.lineJoin='round'; c.lineCap='square';
  MAPS[id].paths.forEach(p=>{ c.beginPath(); p.forEach(([x,y],i)=>{ const X=(x+.5)*s, Y=(y+.5)*s; i?c.lineTo(X,Y):c.moveTo(X,Y); }); c.stroke(); });
  c.strokeStyle='#3A4148'; c.lineWidth=s*.3;
  MAPS[id].paths.forEach(p=>{ c.beginPath(); p.forEach(([x,y],i)=>{ const X=(x+.5)*s, Y=(y+.5)*s; i?c.lineTo(X,Y):c.moveTo(X,Y); }); c.stroke(); });
  const l=MAPS[id].paths[0]; const [bx,by]=l[l.length-1]; c.fillStyle='#E8C51C'; c.fillRect(bx*s+s*.1,by*s+s*.1,s*.8,s*.8);
}
const MEDALS=[[120,'Gold','#E8B700'],[80,'Silber','#ADB5BD'],[40,'Bronze','#C07A3E']];
function bestFor(map,diff){ try{ return +localStorage.getItem(`netzschutz3d-best-${map}-${diff}`)||0; }catch(e){ return 0; } }
function medalFor(w){ return MEDALS.find(m=>w>=m[0]); }
function medalDots(map){ return Object.keys(DIFFS).map(d=>{ const m=medalFor(bestFor(map,d)); return `<i class="md" style="background:${m?m[2]:'var(--line)'}" title="${DIFFS[d].n}: ${m?m[1]:'keine Medaille'}"></i>`; }).join(''); }
function showMenu(inGame){
  const sv=inGame?null:loadSave(), li=levelInfo(), fp=freePoints(), dl=dailyFor(new Date()), done=PROF.daily[dl.key];
  overlay.innerHTML=`<div class="card">
    <h2>Netzschutz 3D</h2>
    <button class="prof" id="mProf"><span class="lvl">${li.L}</span><span class="pt"><b>${rankName(li.L)}</b><span class="xpbar"><i style="width:${li.cur/li.need*100}%"></i></span><small>${fmt(li.cur)} / ${fmt(li.need)} EP${fp>0?` · ${fp} Wissenspunkt${fp>1?'e':''} frei`:''}</small></span></button>
    <div class="menu">
      ${sv?`<button class="primary" id="mCont">Weiterspielen<small>Welle ${sv.wave}, ${MAPS[sv.map].n}, ${DIFFS[sv.diff].n}</small></button>`:''}
      <button class="${sv?'second':'primary'}" id="mNew">Neues Spiel</button>
      <button class="second daily" id="mDaily">Tagesaufgabe<small>${done?'Heute geschafft':dl.title}</small></button>
      <div class="menu row2"><button class="second" id="mAch">Erfolge</button><button class="second" id="mBoard">Bestenliste</button></div>
      <button class="second" id="mHelp">So geht’s</button>
    </div>
  </div>`;
  overlay.hidden=false;
  if(sv) $('#mCont').addEventListener('click',()=>{ sfx('click'); continueGame(sv); });
  $('#mNew').addEventListener('click',()=>{ sfx('click'); showSetup(); });
  $('#mDaily').addEventListener('click',()=>{ sfx('click'); showDaily(); });
  $('#mProf').addEventListener('click',()=>{ sfx('click'); showProfile(); });
  $('#mAch').addEventListener('click',()=>{ sfx('click'); showAch(); });
  $('#mBoard').addEventListener('click',()=>{ sfx('click'); showBoard(); });
  $('#mHelp').addEventListener('click',()=>{ sfx('click'); showHelp(); });
}
function showHelp(){
  overlay.innerHTML=`<div class="card">
    <h2>So geht’s</h2>
    <ul>
      <li>Gerät unten wählen, dann ein Feld zweimal antippen. Auf Hindernissen kann nicht gebaut werden.</li>
      <li>Gebautes Gerät antippen: zwei Ausbaupfade. Nur einer davon geht über Stufe 2 hinaus. Stufe 4 schaltet eine Fähigkeit frei.</li>
      <li>Gegner haben Schichten. Getarnte sieht nicht jedes Gerät, Isolierte sind gegen Funken und Blitze geschützt.</li>
      <li>Ab Welle 35 heilen sich manche Gegner selbst (grüner Ring), ab Welle 45 sind manche gepanzert (Metallring). Störsender legen Geräte in ihrer Nähe kurz lahm.</li>
      <li>Ab Welle 40 kommen Bosse. Erreicht ein Boss den Verteiler, ist das Spiel vorbei.</li>
      <li>Jede Welle bringt Erfahrung für deine Spielerstufe. Pro Stufe gibt es einen Wissenspunkt für dauerhafte Vorteile.</li>
      <li>Medaillen: Bronze ab Welle 40, Silber ab 80, Gold ab 120, für jede Karte und Schwierigkeit.</li>
    </ul>
    <button class="primary" id="back">Zurück</button>
  </div>`;
  $('#back').addEventListener('click',()=>showMenu());
}
function showSetup(){
  overlay.innerHTML=`<div class="card wide">
    <h2>Neues Spiel</h2>
    <h4>Karte</h4>
    <div class="opts maps">${Object.entries(MAPS).map(([k,m])=>`<button class="opt" data-g="map" data-v="${k}"><canvas data-map="${k}"></canvas><b>${m.n}</b><span>${m.lvl}. ${m.d}</span><span class="mds">${medalDots(k)}</span></button>`).join('')}</div>
    <h4>Schwierigkeit</h4>
    <div class="opts diffs">${Object.entries(DIFFS).map(([k,d])=>`<button class="opt chipopt" data-g="diff" data-v="${k}"><b>${d.n}</b><span>${d.lives===1?'1 Leben':d.lives+' Netz'}</span></button>`).join('')}</div>
    <h4>Held</h4>
    <div class="opts heroes">${Object.entries(HEROES).map(([k,h])=>`<button class="opt" data-g="hero" data-v="${k}"><canvas data-ico="${k}"></canvas><b>${h.full}</b><span>${h.desc} Ultra: ${h.ultra}.</span></button>`).join('')}</div>
    <div class="best" id="setupBest"></div>
    <div class="menu row"><button class="second" id="sBack">Zurück</button><button class="primary" id="sGo">Los geht’s</button></div>

  const mark=()=>{ overlay.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',String(pick[b.dataset.g]===b.dataset.v)));
    const b=bestFor(pick.map,pick.diff), m=medalFor(b);
    $('#setupBest').textContent=b?`Dein Bestwert hier: Welle ${b}${m?' ('+m[1]+')':''}`:'Hier hast du noch nicht gespielt.'; };
  overlay.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{ sfx('click'); pick[b.dataset.g]=b.dataset.v; mark(); }));
  overlay.querySelectorAll('canvas[data-map]').forEach(cv=>mapPreview(cv,cv.dataset.map));
  drawIcons(); mark();
  $('#sBack').addEventListener('click',()=>showMenu());
  $('#sGo').addEventListener('click',()=>{ sfx('wave'); startGame(); });
}

/* ---- Fortschritt ---- */
function stat(k,n){ PROF.stats[k]=(PROF.stats[k]||0)+n; }
const DIFF_XP={leicht:.8,normal:1,schwer:1.3,unmoeglich:1.8};
function gainXp(x,why){
  const before=levelInfo().L; PROF.xp+=Math.round(x); const after=levelInfo().L;
  if(after>before){ toast(`Spielerstufe ${after}! Neuer Wissenspunkt`); sfx('level'); }
  saveProf();
}
const ACH=[
  ['w10','Erste Schritte','Schaffe Welle 10.',200,()=>G.wave>=10&&!G.active],
  ['boss1','Bossbezwinger','Besiege einen Boss.',800,()=>PROF.stats.bosses>=1],
  ['w80','Blackout verhindert','Schaffe Welle 80.',2000,()=>G.wave>=80&&!G.active],
  ['w120','Dauerstrom','Schaffe Welle 120.',4000,()=>G.wave>=120&&!G.active],
  ['b100','Bauleiter','Baue insgesamt 100 Geräte.',500,()=>PROF.stats.built>=100],
  ['b1000','Großbaustelle','Baue insgesamt 1.000 Geräte.',3000,()=>PROF.stats.built>=1000],
  ['p10k','Platzwart','Lass insgesamt 10.000 Gegner platzen.',600,()=>PROF.stats.pops>=10000],
  ['p100k','Störungsfrei','Lass insgesamt 100.000 Gegner platzen.',3000,()=>PROF.stats.pops>=100000],
  ['t4','Voll ausgebaut','Bring ein Gerät auf Stufe 4.',500,()=>PROF.stats.tier4>=1],
  ['t4x20','Ausbaukönig','Bring 20 Geräte auf Stufe 4.',2000,()=>PROF.stats.tier4>=20],
  ['ult50','Ultra-Fan','Löse insgesamt 50 Ultras aus.',800,()=>PROF.stats.ultras>=50],
  ['maps','Weltenbummler','Schaffe auf jeder Karte Welle 20.',3000,()=>Object.keys(MAPS).every(m=>Object.keys(DIFFS).some(d=>bestFor(m,d)>=20))],
  ['unm','Unmöglich?','Schaffe Welle 20 auf Unmöglich.',2500,()=>curDiff==='unmoeglich'&&G.wave>=20&&!G.active],
  ['heroes','Teamwork','Bring alle drei Helden auf Stufe 10.',3000,()=>Object.keys(HEROES).every(h=>(PROF.heroMax[h]||0)>=10)],
  ['rich','Kupfermagnat','Hab 100.000 Kupfer auf einmal.',1500,()=>G.money>=100000],
  ['daily5','Tagesgeschäft','Schaffe 5 Tagesaufgaben.',2000,()=>Object.keys(PROF.daily).length>=5],
  ['perfect','Fehlerfrei','Schaffe Welle 40, ohne Netz zu verlieren.',2500,()=>G.wave>=40&&!G.active&&!G.lostLives],
  ['gold','Goldjunge','Hol eine Goldmedaille.',4000,()=>Object.keys(MAPS).some(m=>Object.keys(DIFFS).some(d=>bestFor(m,d)>=120))]
];
function checkAch(){
  for(const [id,n,,xp,fn] of ACH){ if(PROF.ach[id]) continue; let ok=false; try{ ok=fn(); }catch(e){} if(ok){ PROF.ach[id]=Date.now(); toast(`Erfolg: ${n} (+${xp} EP)`); sfx('done'); gainXp(xp); } }
  saveProf();
}
function onWaveDone(){
  const w=G.wave;
  stat('pops',G.pops); G.pops=0; stat('waves',1);
  if(G.bossKills){ stat('bosses',G.bossKills); G.bossKills=0; }
  if(G.ultras){ stat('ultras',G.ultras); G.ultras=0; }
  if(G.hero) PROF.heroMax[curHero]=Math.max(PROF.heroMax[curHero]||0,G.hero.hlv);
  gainXp((10+w*2)*DIFF_XP[curDiff]*(w%40===0?3:1));
  if(DAILY && !PROF.daily[DAILY.key] && w>=DAILY.goal){ PROF.daily[DAILY.key]=1; toast(`Tagesaufgabe geschafft! +1500 EP`); sfx('level'); gainXp(1500); }
  checkAch();
}
function showProfile(){
  const li=levelInfo(), fp=freePoints(), st=PROF.stats;
  overlay.innerHTML=`<div class="card wide">
    <h2>${rankName(li.L)}</h2>
    <p>Spielerstufe ${li.L}, ${fmt(li.cur)} von ${fmt(li.need)} EP bis zur nächsten Stufe.</p>
    <div class="xpbar big"><i style="width:${li.cur/li.need*100}%"></i></div>
    <h4>Wissen <small>${fp} Punkt${fp===1?'':'e'} frei</small></h4>
    <div class="perks">${Object.entries(PERKS).map(([k,p])=>{ const r=perk(k); return `<div class="perk"><div><b>${p.n}</b><span>${p.d}</span></div><div class="pips">${Array.from({length:p.max},(_,i)=>`<span class="${i<r?'on':''}"></span>`).join('')}</div><button class="chip" data-perk="${k}" ${r>=p.max||fp<=0?'disabled':''}>${r>=p.max?'Max':'Lernen'}</button></div>`; }).join('')}</div>
    <h4>Statistik</h4>
    <div class="stats2">
      <span>Spiele</span><b>${fmt(st.games||0)}</b><span>Wellen geschafft</span><b>${fmt(st.waves||0)}</b>
      <span>Gegner zerstört</span><b>${fmt(st.pops||0)}</b><span>Geräte gebaut</span><b>${fmt(st.built||0)}</b>
      <span>Bosse besiegt</span><b>${fmt(st.bosses||0)}</b><span>Ultras</span><b>${fmt(st.ultras||0)}</b>
    </div>
    <div class="menu row"><button class="second" id="pReset" ${Object.keys(PROF.perks).length?'':'disabled'}>Wissen zurücksetzen</button><button class="primary" id="pBack">Zurück</button></div>
  </div>`;
  overlay.querySelectorAll('[data-perk]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.perk; if(freePoints()>0&&perk(k)<PERKS[k].max){ PROF.perks[k]=perk(k)+1; saveProf(); sfx('upgrade'); showProfile(); } }));
  $('#pReset').addEventListener('click',()=>{ PROF.perks={}; saveProf(); sfx('coin'); showProfile(); });
  $('#pBack').addEventListener('click',()=>showMenu());
}
function showAch(){
  const n=ACH.filter(a=>PROF.ach[a[0]]).length;
  overlay.innerHTML=`<div class="card wide">
    <h2>Erfolge</h2><p>${n} von ${ACH.length} geschafft.</p>
    <div class="achs">${ACH.map(([id,nm,d,xp])=>`<div class="ach ${PROF.ach[id]?'done':''}"><i></i><div><b>${nm}</b><span>${d}</span></div><em>${fmt(xp)} EP</em></div>`).join('')}</div>
    <h4>Medaillen</h4>
    <div class="medtab">${Object.entries(MAPS).map(([k,m])=>`<span>${m.n}</span><span class="mds">${medalDots(k)}</span>`).join('')}</div>
    <p class="small">Die Punkte stehen für Leicht, Normal, Schwer und Unmöglich.</p>
    <button class="primary" id="aBack">Zurück</button>
  </div>`;
  $('#aBack').addEventListener('click',()=>showMenu());
}
/* ---- Tagesaufgabe ---- */
const DAILY_MODS=[
  ['fast','Turbo-Störung','Alle Gegner sind 25 % schneller.'],
  ['reich','Kupferregen','50 % mehr Kupfer.'],
  ['arm','Sparflamme','Nur 400 Kupfer zum Start.'],
  ['spaet','Späteinsteiger','Start bei Welle 25 mit 7.000 Kupfer.'],
  ['ohneheld','Ohne Held','Heute kein Held.'],
  ['auswahl','Begrenzte Auswahl','Nur fünf Gerätetypen erlaubt.'],
  ['tank','Dicke Brocken','Gegner mit mehreren Schichten halten 30 % mehr aus.']
];
function dailyFor(date){
  const key=date.getFullYear()*10000+(date.getMonth()+1)*100+date.getDate();
  const R=rng(key), maps=Object.keys(MAPS), heroes=Object.keys(HEROES);
  const mod=DAILY_MODS[Math.floor(R()*DAILY_MODS.length)];
  const d={key:String(key),map:maps[Math.floor(R()*maps.length)],diff:R()<.6?'normal':'schwer',hero:heroes[Math.floor(R()*heroes.length)],mod:mod[0],title:mod[1],desc:mod[2]};
  d.goal=d.mod==='spaet'?45:d.diff==='schwer'?30:40;
  if(d.mod==='auswahl'){ const pool=KEYS.filter(k=>k!=='held'&&k!=='windrad'); const pickN=[]; while(pickN.length<5){ const k=pool[Math.floor(R()*pool.length)]; if(!pickN.includes(k)) pickN.push(k); } d.only=pickN; d.desc+=' Heute: '+pickN.map(k=>TOWERS[k].n).join(', ')+'.'; }
  return d;
}
function showDaily(){
  const d=dailyFor(new Date()), done=PROF.daily[d.key];
  overlay.innerHTML=`<div class="card">
    <h2>Tagesaufgabe</h2>
    <p><b>${d.title}.</b> ${d.desc}</p>
    <canvas data-map="${d.map}" class="dprev"></canvas>
    <p>Karte: ${MAPS[d.map].n}<br>Schwierigkeit: ${DIFFS[d.diff].n}<br>Held: ${d.mod==='ohneheld'?'keiner':HEROES[d.hero].full}<br>Ziel: Welle ${d.goal} schaffen</p>
    <p class="small">${done?'Heute schon geschafft. Du kannst trotzdem nochmal spielen.':'Belohnung: 1.500 EP. Morgen gibt es eine neue Aufgabe.'}</p>
    <div class="menu row"><button class="second" id="dBack">Zurück</button><button class="primary" id="dGo">Starten</button></div>
  </div>`;
  overlay.querySelectorAll('canvas[data-map]').forEach(cv=>mapPreview(cv,cv.dataset.map));
  $('#dBack').addEventListener('click',()=>showMenu());
  $('#dGo').addEventListener('click',()=>{ sfx('wave'); startGame(d); });
}
function gameOver(){
  G.running=false; G.build=null; G.sel=null; G.ghost=null;
  const reached=Math.max(0,G.wave-1);
  if(!DAILY) saveBest(reached);
  clearSave();
  stat('pops',G.pops||0); G.pops=0; saveProf();
  const best=loadBest();
  sfx('boss');
  overlay.innerHTML=`<div class="card">
    <h2>Netz ausgefallen</h2>
    <p>Du hast ${reached===1?'1 Welle':fmt(reached)+' Wellen'} abgewehrt (${MAPS[curMap].n}, ${DIFFS[curDiff].n}${DAILY?', Tagesaufgabe':''}).</p>
    ${DAILY?'':`<div class="best">${reached>=best&&reached>0?'Neuer Bestwert!':'Bestwert: Welle '+best}</div>`}
    <div class="menu"><button class="primary" id="againBtn">Nochmal</button><button class="second" id="toMenu">Menü</button></div>
  </div>`;
  overlay.hidden=false;
  $('#againBtn').addEventListener('click',()=>startGame(DAILY));
  $('#toMenu').addEventListener('click',()=>showMenu());
}
$('#menuBtn').addEventListener('click',()=>{ const ig=G.running; if(ig){ G.paused=true; } showMenu(ig); const c=overlay.querySelector('.menu'); if(G.running&&c){ const b=document.createElement('button'); b.className='primary'; b.textContent='Zurück zum Spiel'; b.addEventListener('click',()=>{ overlay.hidden=true; G.paused=false; }); c.prepend(b); } });

/* ---- Speichern ---- */
const SAVE_KEY='netzschutz3d-save';
function saveGame(){
  if(!G.running||DAILY) return;
  const sw=portrait;
  const data={v:1,map:curMap,diff:curDiff,hero:curHero,wave:G.wave,money:G.money,lives:G.lives,ultraCd:G.ultraCd,auto:G.auto,
    abil:Object.fromEntries(Object.entries(G.abil).map(([k,a])=>[k,a.cd])),
    towers:G.towers.map(t=>({type:t.type,x:sw?t.y:t.x,y:sw?t.x:t.y,lv:t.lv,hlv:t.hlv,xp:t.xp,prio:t.prio,spent:t.spent}))};
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(data)); }catch(e){}
}
function loadSave(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); return d&&d.v===1&&MAPS[d.map]&&DIFFS[d.diff]&&HEROES[d.hero]?d:null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function continueGame(sv){
  DAILY=null;
  curMap=sv.map; curDiff=sv.diff; setHero(sv.hero); pick={map:sv.map,diff:sv.diff,hero:sv.hero};
  newGame(); applyMap(); renderBar();
  Object.assign(G,{wave:sv.wave,money:sv.money,lives:sv.lives,ultraCd:sv.ultraCd||0,auto:!!sv.auto,running:true});
  for(const o of sv.towers){
    const x=portrait?o.y:o.x, y=portrait?o.x:o.y;
    if(!TOWERS[o.type]||!canBuild(x,y)) continue;
    const t={id:uid++,type:o.type,x,y,lv:o.lv||[0,0],spent:o.spent||0,cd:0,prio:o.prio||'first'};
    if(o.type==='held'){ t.hlv=o.hlv||1; t.xp=o.xp||0; G.hero=t; }
    G.towers.push(t); addTowerMesh(t);
  }
  recalc();
  for(const t of G.towers) if(t.type!=='held'&&Math.max(t.lv[0],t.lv[1])>=4) G.abil[t.type]={cd:(sv.abil&&sv.abil[t.type])||0};
  overlay.hidden=true; G.autoT=1.5;
  toast(`Weiter geht’s mit Welle ${G.wave+1}`);
}

/* ---- Bestenliste ---- */
let DB=null, USER=null, myId=null;
(async()=>{ try{ if(!window.claude||!window.claude.use) return; DB=await window.claude.use('db'); USER=await window.claude.use('user'); if(USER) myId=await USER.id(); }catch(e){ DB=null; } })();
async function submitScore(w){
  if(!DB||!myId||!(w>0)) return;
  try{
    const ref=DB.collection('scores').doc(myId), snap=await ref.get();
    const cur=snap.exists?(+(snap.data().wave)||0):0;
    if(w>cur) await ref.set({wave:w,map:curMap,diff:curDiff,hero:curHero,at:Date.now()});
  }catch(e){}
}
async function showBoard(){
  overlay.innerHTML=`<div class="card"><h2>Bestenliste</h2><div id="boardList" class="board"><p>Wird geladen …</p></div><button class="primary" id="bBack">Zurück</button></div>`;
  $('#bBack').addEventListener('click',()=>showMenu());
  const el=$('#boardList');
  if(!DB){
    const rows=Object.entries(MAPS).map(([k,m])=>{ const ws=Object.keys(DIFFS).map(d=>bestFor(k,d)); return `<div class="brow"><span class="bn">${m.n}</span><b>${Math.max(...ws)?'Welle '+Math.max(...ws):'–'}</b><span class="bi">${Object.keys(DIFFS).map((d,i)=>DIFFS[d].n+': '+(ws[i]||'–')).join(', ')}</span></div>`; }).join('');
    el.innerHTML='<p class="small">Deine Rekorde auf diesem Gerät:</p>'+rows; return;
  }
  try{
    const q=await DB.collection('scores').orderBy('wave','desc').limit(25).get();
    if(!q.docs.length){ el.innerHTML='<p>Noch keine Einträge. Spiel eine Runde und sei der Erste!</p>'; return; }
    const ids=q.docs.map(d=>d.id);
    const ps=USER?await USER.profiles(ids):{};
    el.innerHTML='';
    q.docs.forEach((d,i)=>{
      const v=d.data()||{}, row=document.createElement('div'); row.className='brow'+(d.id===myId?' me':'');
      const nm=document.createElement('span'); nm.className='bn'; nm.textContent=`${i+1}. ${(ps[d.id]&&ps[d.id].name)||'Jemand'}${d.id===myId?' (du)':''}`;
      const inf=document.createElement('span'); inf.className='bi'; inf.textContent=`${MAPS[v.map]?MAPS[v.map].n:''}, ${DIFFS[v.diff]?DIFFS[v.diff].n:''}`;
      const wv=document.createElement('b'); wv.textContent=`Welle ${v.wave}`;
      row.append(nm,wv,inf); el.appendChild(row);
    });
  }catch(e){ el.innerHTML='<p>Die Bestenliste konnte gerade nicht geladen werden.</p>'; }
}

/* ================= Schleife ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.running && !G.paused){
    const steps=G.speed;
    for(let i=0;i<steps && G.running;i++) update(dt);
  }
  G.hurtT=(G.hurtT||0)-dt;
  try{ render(now,dt*(G.paused?0:1)); }catch(err){ console.error(err); }
  updateUI();
  requestAnimationFrame(frame);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
setHero(curHero);
newGame();
readColors();
setupMap();
renderBar();
init3D();
drawIcons();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawIcons);
if(HAS3D) scene.background=new THREE.Color(C.paper);
new ResizeObserver(resize).observe(stage);
resize();
if(!HAS3D) toast('3D konnte nicht geladen werden. Bitte Seite neu laden.');
showMenu();
requestAnimationFrame(frame);

</script>
